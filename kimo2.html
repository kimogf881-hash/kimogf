<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
  transition:0.3s;
}

.dark{background:#121212;color:#fff;}

.container{padding:15px;max-width:600px;margin:auto;}

/* TOP MENU */
.top-menu{
  display:flex;
  gap:8px;
}

.menu-item{
  flex:1;
  background:#fff;
  padding:10px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.25s;
}

.menu-item i{
  display:block;
  margin-bottom:5px;
  font-size:18px;
  color:#2196f3;
}

.menu-item:hover{
  transform:translateY(-3px);
}

.dark .menu-item{
  background:#1e1e1e;
  color:#fff;
}

/* CARD */
.card{
  background:linear-gradient(45deg,#2196f3,#21cbf3);
  color:#fff;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  animation:fadeIn .3s ease;
}

/* PROFILE */
.profile{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  animation:fadeIn .3s ease;
}

.dark .profile{background:#1e1e1e}

.cover{
  height:170px;
  background:linear-gradient(45deg,#2196f3,#21cbf3);
}

.avatar-box{
  text-align:center;
  margin-top:-60px;
  position:relative;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  border:4px solid #fff;
  background:#ccc;
  background-size:cover;
  background-position:center;
  margin:auto;
}

.camera{
  position:absolute;
  bottom:10px;
  right:40%;
  background:#2196f3;
  width:30px;
  height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  cursor:pointer;
}

/* INPUTS */
input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

button{
  background:#2196f3;
  color:#fff;
  cursor:pointer;
}

/* SETTINGS */
.setting{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
}

.dark .setting{background:#1e1e1e}

/* SUPPORT */
.support-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.support-item{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  color:#333;
  transition:0.25s;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
}

.support-item i{
  font-size:28px;
  display:block;
  margin-bottom:8px;
  color:#2196f3;
}

.support-item:hover{
  transform:translateY(-5px) scale(1.05);
}

.dark .support-item{
  background:#1e1e1e;
  color:#fff;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.service{
  background:#fff;
  padding:15px;
  border-radius:12px;
  text-align:center;
  transition:0.2s;
  cursor:pointer;
}

.service:hover{
  transform:scale(1.05);
}

.dark .service{
  background:#1e1e1e;
}

/* ANIMATION */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<div class="container">

<h2 id="title"></h2>

<div class="top-menu">

<div class="menu-item" onclick="openProfile()">
<i class="fas fa-user"></i><span id="p"></span>
</div>

<div class="menu-item" onclick="openSettings()">
<i class="fas fa-cog"></i><span id="s"></span>
</div>

<div class="menu-item" onclick="openBookings()">
<i class="fas fa-calendar"></i><span id="b"></span>
</div>

<div class="menu-item" onclick="openSupport()">
<i class="fas fa-headset"></i><span id="su"></span>
</div>

<div class="menu-item" onclick="openServices()">
<i class="fas fa-grid-2"></i><span id="sv"></span>
</div>

</div>

<div id="content"></div>

</div>

<script>

/* LANG */
const T={
ar:{
title:"حجوزاتي",
profile:"الملف",
settings:"الإعدادات",
bookings:"الحجوزات",
support:"الدعم",
services:"الخدمات",
dark:"الوضع الليلي",
lang:"اللغة",
on:"مفعل",
off:"غير مفعل"
},
en:{
title:"Bookings",
profile:"Profile",
settings:"Settings",
bookings:"Bookings",
support:"Support",
services:"Services",
dark:"Dark Mode",
lang:"Language",
on:"ON",
off:"OFF"
}
};

let lang=localStorage.getItem("lang")||"ar";

let profile=JSON.parse(localStorage.getItem("profile"))||{
name:"اسم المستخدم",
bio:"نبذة",
img:""
};

/* APPLY */
function applyLang(){

let t=T[lang];

title.innerText=t.title;
p.innerText=t.profile;
s.innerText=t.settings;
b.innerText=t.bookings;
su.innerText=t.support;
sv.innerText=t.services;

document.documentElement.dir=(lang==="ar")?"rtl":"ltr";
}

/* PROFILE */
function openProfile(){

content.innerHTML=`
<div class="profile">

<div class="cover"></div>

<div class="avatar-box">

<div class="avatar" style="background-image:url('${profile.img}')"></div>

<div class="camera" onclick="file.click()">📷</div>
<input type="file" id="file" hidden onchange="uploadImg(event)">

</div>

<div style="text-align:center;padding:10px">

<h3>${profile.name}</h3>
<p>${profile.bio}</p>

</div>

<div style="padding:15px">

<input id="name" value="${profile.name}">
<input id="bio" value="${profile.bio}">

<button onclick="saveProfile()">حفظ</button>

</div>

</div>`;
}

/* SAVE */
function saveProfile(){

profile.name=document.getElementById("name").value;
profile.bio=document.getElementById("bio").value;

localStorage.setItem("profile",JSON.stringify(profile));

openProfile();
}

/* IMAGE */
function uploadImg(e){
let r=new FileReader();
r.onload=function(){
profile.img=r.result;
localStorage.setItem("profile",JSON.stringify(profile));
openProfile();
}
r.readAsDataURL(e.target.files[0]);
}

/* SETTINGS */
function openSettings(){

content.innerHTML=`
<div class="card">

<h3>${T[lang].settings}</h3>

<div class="setting">
<span>${T[lang].dark}</span>
<button onclick="toggleDark();openSettings()">
${document.body.classList.contains("dark")?T[lang].on:T[lang].off}
</button>
</div>

<select onchange="changeLang(this.value)">
<option value="ar" ${lang==="ar"?"selected":""}>العربية</option>
<option value="en" ${lang==="en"?"selected":""}>English</option>
</select>

</div>`;
}

/* SERVICES */
function openServices(){

content.innerHTML=`
<div class="services">

<div class="service">✈️ ${lang==="ar"?"سفر":"Travel"}</div>
<div class="service">🏨 ${lang==="ar"?"فنادق":"Hotels"}</div>
<div class="service">🏥 ${lang==="ar"?"رعاية":"Health"}</div>
<div class="service">🏛️ ${lang==="ar"?"قاعات":"Halls"}</div>
<div class="service">🚗 ${lang==="ar"?"مركبة":"Car"}</div>

</div>`;
}

/* BOOKINGS */
function openBookings(){
content.innerHTML="<div class='card'>📅 "+T[lang].bookings+"</div>";
}

/* SUPPORT */
function openSupport(){

content.innerHTML=`
<div class="card">

<div class="support-box">

<a class="support-item" href="https://wa.me/249994501781">
<i class="fab fa-whatsapp"></i>WhatsApp
</a>

<a class="support-item" href="tel:0964500007">
<i class="fas fa-phone"></i>Call
</a>

<a class="support-item" href="mailto:maoiaydgf@gmail.com">
<i class="fas fa-envelope"></i>Email
</a>

</div>

</div>`;
}

/* DARK */
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem("dark",document.body.classList.contains("dark"));
}

/* LANG */
function changeLang(l){
lang=l;
localStorage.setItem("lang",l);
applyLang();
openSettings();
}

/* INIT */
window.onload=applyLang;

</script>

</body>
</html>
