<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
  transition:0.3s;
}

/* ANDROID SIZE */
.container{
  padding:12px;
  max-width:420px;
  margin:auto;
  padding-bottom:80px;
}

.dark{background:#121212;color:#fff;}

/* CARD */
.card{
  background:linear-gradient(45deg,#2196f3,#21cbf3);
  color:#fff;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  animation:fadeIn .3s ease;
}

/* PROFILE */
.profile{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  animation:fadeIn .3s ease;
}

.dark .profile{background:#1e1e1e}

.cover{
  height:160px;
  background:linear-gradient(45deg,#2196f3,#21cbf3);
}

.avatar-box{
  text-align:center;
  margin-top:-55px;
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:4px solid #fff;
  background:#ccc;
  background-size:cover;
  background-position:center;
  margin:auto;
}

/* SETTINGS */
.setting{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
}

.dark .setting{background:#1e1e1e}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.service{
  background:#fff;
  padding:15px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.service:hover{transform:scale(1.05);}
.dark .service{background:#1e1e1e}

/* SUPPORT */
.support-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.support-item{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  color:#333;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  transition:0.25s;
}

.support-item i{
  font-size:28px;
  display:block;
  margin-bottom:8px;
  color:#2196f3;
}

.support-item:hover{
  transform:translateY(-5px) scale(1.05);
}

.dark .support-item{
  background:#1e1e1e;
  color:#fff;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -5px 15px rgba(0,0,0,0.1);
}

.dark .bottom-nav{background:#1e1e1e}

.nav-item{
  text-align:center;
  font-size:12px;
  cursor:pointer;
  color:#666;
}

.nav-item i{display:block;font-size:18px;}

/* ANIMATION */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

/* 🔥 TOGGLE SWITCH */
.theme-btn{
  width:60px;
  height:30px;
  border-radius:20px;
  background:#fff;
  border:2px solid #2196f3;
  position:relative;
  cursor:pointer;
  transition:0.3s;
}

.theme-btn::after{
  content:'';
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#2196f3;
  top:50%;
  transform:translateY(-50%);
  left:3px;
  transition:0.3s;
}

.theme-btn.active{
  background:#4caf50;
  border-color:#4caf50;
}

.theme-btn.active::after{
  left:32px;
  background:#fff;
}

</style>
</head>

<body>

<div class="container">

<h2 id="title"></h2>

<div id="content"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

<div class="nav-item" onclick="setPage('services')">
<i class="fas fa-grid-2"></i><span id="sv"></span>
</div>

<div class="nav-item" onclick="setPage('bookings')">
<i class="fas fa-calendar"></i><span id="b"></span>
</div>

<div class="nav-item" onclick="setPage('support')">
<i class="fas fa-headset"></i><span id="su"></span>
</div>

<div class="nav-item" onclick="setPage('profile')">
<i class="fas fa-user"></i><span id="p"></span>
</div>

</div>

<script>

/* ===== LANG DATA ===== */
const T={
ar:{
title:"حجوزاتي",
profile:"الملف",
bookings:"الحجوزات",
support:"الدعم",
services:"الخدمات",
dark:"الوضع الليلي"
},
en:{
title:"Bookings",
profile:"Profile",
bookings:"Bookings",
support:"Support",
services:"Services",
dark:"Dark Mode"
}
};

let lang = localStorage.getItem("lang") || "ar";
let currentPage = "services";

/* PROFILE DATA */
let profile = JSON.parse(localStorage.getItem("profile")) || {
name:"اسم المستخدم",
bio:"نبذة"
};

/* ===== APPLY LANGUAGE (FIXED 100%) ===== */
function applyLang(){

let t = T[lang];

title.innerText = t.title;
p.innerText = t.profile;
b.innerText = t.bookings;
su.innerText = t.support;
sv.innerText = t.services;

document.documentElement.dir = (lang==="ar") ? "rtl" : "ltr";

localStorage.setItem("lang", lang);

}

/* ===== NAV ===== */
function setPage(page){
currentPage = page;
refreshPage();
}

/* ===== REFRESH PAGE ===== */
function refreshPage(){

if(currentPage==="services") openServices();
if(currentPage==="bookings") openBookings();
if(currentPage==="support") openSupport();
if(currentPage==="profile") openProfile();

}

/* ===== SERVICES ===== */
function openServices(){
content.innerHTML=`
<div class="services">

<div class="service">✈️ ${lang==="ar"?"سفر":"Travel"}</div>
<div class="service">🏨 ${lang==="ar"?"فنادق":"Hotels"}</div>
<div class="service">🏥 ${lang==="ar"?"رعاية":"Health"}</div>
<div class="service">🏛️ ${lang==="ar"?"قاعات":"Halls"}</div>
<div class="service">🚗 ${lang==="ar"?"مركبة":"Car"}</div>

</div>`;
}

/* ===== BOOKINGS ===== */
function openBookings(){
content.innerHTML="<div class='card'>📅 "+T[lang].bookings+"</div>";
}

/* ===== SUPPORT ===== */
function openSupport(){
content.innerHTML=`
<div class="card">

<div class="support-box">

<a class="support-item"><i class="fab fa-whatsapp"></i>WhatsApp</a>
<a class="support-item"><i class="fas fa-phone"></i>Call</a>
<a class="support-item"><i class="fas fa-envelope"></i>Email</a>

</div>

</div>`;
}

/* ===== PROFILE + SETTINGS ===== */
function openProfile(){

content.innerHTML=`
<div class="profile">

<div class="cover"></div>

<div class="avatar-box">
<div class="avatar"></div>
</div>

<div style="text-align:center;padding:10px">
<h3>${profile.name}</h3>
<p>${profile.bio}</p>
</div>

<div style="padding:15px">

<h3>${T[lang].dark}</h3>

<div class="setting">
<span>${T[lang].dark}</span>
<div class="theme-btn" id="themeBtn" onclick="toggleDark(this)"></div>
</div>

<select onchange="changeLang(this.value)">
<option value="ar" ${lang==="ar"?"selected":""}>العربية</option>
<option value="en" ${lang==="en"?"selected":""}>English</option>
</select>

</div>

</div>`;
}

/* ===== DARK MODE ===== */
function toggleDark(btn){

document.body.classList.toggle("dark");

let isDark = document.body.classList.contains("dark");

localStorage.setItem("dark", isDark);

btn.classList.toggle("active", isDark);

}

/* ===== LANGUAGE FIX ===== */
function changeLang(l){

lang = l;
localStorage.setItem("lang", lang);

/* 🔥 مهم جداً */
applyLang();
refreshPage();

}

/* ===== LOAD ===== */
window.onload=function(){

if(localStorage.getItem("dark")==="true"){
document.body.classList.add("dark");
}

applyLang();
refreshPage();

}

</script>

</body>
</html>
