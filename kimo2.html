<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
  transition:0.3s;
}

/* ANDROID SIZE */
.container{
  padding:12px;
  max-width:420px;
  margin:auto;
  padding-bottom:90px;
}

.dark{background:#121212;color:#fff;}

/* HEADER */
.header{
  background:linear-gradient(45deg,#2196f3,#21cbf3);
  color:#fff;
  padding:18px;
  border-radius:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

/* CARD */
.card{
  background:linear-gradient(45deg,#2196f3,#21cbf3);
  color:#fff;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

/* PROFILE 🔥 (تطوير فقط هنا) */
.profile{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  animation:fadeIn .3s ease;
}

.dark .profile{background:#1e1e1e}

.cover{
  height:170px;
  background:linear-gradient(45deg,#2196f3,#21cbf3);
  position:relative;
}

/* avatar احترافي */
.avatar-box{
  text-align:center;
  margin-top:-60px;
  position:relative;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  border:4px solid #fff;
  background:linear-gradient(45deg,#ddd,#bbb);
  margin:auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  animation:pop 0.4s ease;
}

/* اسم + ايميل */
.user-info{
  text-align:center;
  padding:10px;
}

.user-info h3{
  margin:5px 0;
}

.user-info p{
  font-size:13px;
  color:#777;
}

/* SETTINGS */
.setting{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.dark .setting{background:#1e1e1e}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.service{
  background:#fff;
  padding:15px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.service:hover{
  transform:translateY(-8px) scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.dark .service{background:#1e1e1e}

/* SUPPORT */
.support-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:10px;
}

.support-item{
  background:#fff;
  padding:18px 10px;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.support-item:hover{
  transform:translateY(-8px) scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.support-item i{
  font-size:28px;
  color:#2196f3;
  margin-bottom:8px;
  display:block;
}

.support-item span{
  font-size:12px;
  font-weight:bold;
}

.dark .support-item{
  background:#1e1e1e;
  color:#fff;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:420px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-radius:15px;
  box-shadow:0 -5px 15px rgba(0,0,0,0.1);
}

.dark .bottom-nav{background:#1e1e1e}

.nav-item{
  flex:1;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  color:#666;
  transition:0.3s;
}

.nav-item:hover{
  transform:scale(1.1);
  color:#2196f3;
}

.nav-item i{display:block;font-size:18px;}

/* TOGGLE */
.theme-btn{
  width:60px;
  height:30px;
  border-radius:20px;
  background:#fff;
  border:2px solid #2196f3;
  position:relative;
  cursor:pointer;
}

.theme-btn::after{
  content:'';
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#2196f3;
  top:50%;
  transform:translateY(-50%);
  left:3px;
  transition:0.3s;
}

.theme-btn.active{
  background:#4caf50;
  border-color:#4caf50;
}

.theme-btn.active::after{
  left:32px;
  background:#fff;
}

/* animations */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes pop{
  from{transform:scale(0.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<div class="container">

<div class="header" id="title"></div>

<div id="content"></div>

</div>

<!-- NAV -->
<div class="bottom-nav">

<div class="nav-item" onclick="setPage('services')">
<i class="fas fa-globe"></i><span id="sv"></span>
</div>

<div class="nav-item" onclick="setPage('bookings')">
<i class="fas fa-calendar"></i><span id="b"></span>
</div>

<div class="nav-item" onclick="setPage('support')">
<i class="fas fa-headset"></i><span id="su"></span>
</div>

<div class="nav-item" onclick="setPage('profile')">
<i class="fas fa-user"></i><span id="p"></span>
</div>

</div>

<script>

const T={
ar:{
title:"حجوزاتي",
profile:"الملف",
bookings:"الحجوزات",
support:"الدعم",
services:"الرئيسية"
},
en:{
title:"Bookings",
profile:"Profile",
bookings:"Bookings",
support:"Support",
services:"Home"
}
};

let lang = localStorage.getItem("lang") || "ar";
let currentPage = "services";

function applyLang(){
let t = T[lang];

title.innerText = t.title;
p.innerText = t.profile;
b.innerText = t.bookings;
su.innerText = t.support;
sv.innerText = t.services;

document.documentElement.dir = (lang==="ar") ? "rtl" : "ltr";
}

function setPage(page){
currentPage = page;
refreshPage();
}

function refreshPage(){
if(currentPage==="services") openServices();
if(currentPage==="bookings") openBookings();
if(currentPage==="support") openSupport();
if(currentPage==="profile") openProfile();
}

function openProfile(){
content.innerHTML=`
<div class="profile">

<div class="cover"></div>

<div class="avatar-box">
<div class="avatar"></div>
</div>

<div class="user-info">
<h3 id="username">اسم المستخدم</h3>
<p id="email">user@email.com</p>
</div>

<div style="padding:15px">

<div class="setting">
<span>الوضع الليلي</span>
<div class="theme-btn" onclick="toggleDark(this)"></div>
</div>

<select onchange="changeLang(this.value)">
<option value="ar" ${lang==="ar"?"selected":""}>العربية</option>
<option value="en" ${lang==="en"?"selected":""}>English</option>
</select>

</div>

</div>`;
}

/* باقي الصفحات بدون تغيير */
function openServices(){
content.innerHTML=`<div class="services">
<div class="service">✈️ ${lang==="ar"?"سفر":"Travel"}</div>
<div class="service">🏨 ${lang==="ar"?"فنادق":"Hotels"}</div>
<div class="service">🏥 ${lang==="ar"?"رعاية":"Health"}</div>
<div class="service">🏛️ ${lang==="ar"?"قاعات":"Halls"}</div>
<div class="service">🚗 ${lang==="ar"?"مركبة":"Car"}</div>
</div>`;
}

function openBookings(){
content.innerHTML="<div class='card'>📅 "+T[lang].bookings+"</div>";
}

function openSupport(){
content.innerHTML=`<div class="card"><div class="support-box">
<div class="support-item"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></div>
<div class="support-item"><i class="fas fa-phone"></i><span>Call</span></div>
<div class="support-item"><i class="fas fa-envelope"></i><span>Email</span></div>
</div></div>`;
}

function toggleDark(btn){
document.body.classList.toggle("dark");
btn.classList.toggle("active");
}

function changeLang(l){
lang=l;
localStorage.setItem("lang",l);
applyLang();
refreshPage();
}

window.onload=function(){
applyLang();
refreshPage();
}

</script>

</body>
</html>
