<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --primary:#2563eb;
  --card:#ffffff;
  --text:#1e293b;
  --sub:#64748b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#e0e7ff,#f5f7fb);
}

.app{
  width:360px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:var(--text);
}

.tabs{
  display:flex;
  background:#eef2ff;
  border-radius:14px;
  padding:4px;
  margin:15px 0;
}

.tabs div{
  flex:1;
  text-align:center;
  padding:10px;
  cursor:pointer;
  color:var(--sub);
  transition:0.3s;
}

.tabs .active{
  background:white;
  color:var(--primary);
  border-radius:10px;
}

.form{display:none;}
.form.active{
  display:block;
  animation:pop 0.4s ease;
}

@keyframes pop{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.input input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #e2e8f0;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  cursor:pointer;
}

.google-btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  background:white;
  border:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  transition:0.3s;
  font-weight:500;
}

.google-btn:hover{
  transform:scale(1.03);
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.google-btn img{
  width:18px;
}

/* ===================== LOADER (ثعبان مموج) ===================== */
.loader-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  flex-direction:column;
}

.snake{
  width:70px;
  height:70px;
  border-radius:50%;
  border:5px solid transparent;
  border-top:5px solid var(--primary);
  border-bottom:5px solid var(--primary);
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg) scale(1);}
  50%{transform:rotate(180deg) scale(1.1);}
  100%{transform:rotate(360deg) scale(1);}
}

.check{
  display:none;
  font-size:50px;
  color:#16a34a;
  margin-top:15px;
  animation:pop 0.4s ease;
}
</style>
</head>

<body>

<!-- Loader -->
<div class="loader-overlay" id="loader">
  <div class="snake"></div>
  <div class="check" id="check">✔</div>
</div>

<div class="app">

  <div class="top">
    <div class="logo">حجوزاتي</div>
  </div>

  <div class="tabs">
    <div id="loginTab" class="active" onclick="showLogin()">دخول</div>
    <div id="signupTab" onclick="showSignup()">إنشاء حساب</div>
  </div>

  <!-- login -->
  <div id="loginForm" class="form active">

    <div class="input">
      <input id="loginEmail" placeholder="الإيميل أو رقم الهاتف">
    </div>

    <div class="input">
      <input id="loginPassword" type="password" placeholder="كلمة المرور">
    </div>

    <button class="btn" onclick="login()">دخول</button>

    <p style="text-align:center; margin-top:10px; cursor:pointer; color:#2563eb;" onclick="forgotPassword()">
      نسيت كلمة السر؟
    </p>

    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      تسجيل الدخول باستخدام Google
    </button>

  </div>

  <!-- signup -->
  <div id="signupForm" class="form">

    <div class="input"><input id="signupName" placeholder="الاسم"></div>
    <div class="input"><input id="signupEmail" placeholder="الإيميل"></div>
    <div class="input"><input id="signupPassword" type="password" placeholder="كلمة المرور"></div>

    <button class="btn" onclick="signup()">إنشاء حساب</button>

    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      التسجيل باستخدام Google
    </button>

  </div>

</div>

<script>

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAv6mskNbOqDqOFDyX3GFRr6JtC2_mBU14",
  authDomain: "my-reservatinos.firebaseapp.com",
  projectId: "my-reservatinos",
  storageBucket: "my-reservatinos.firebasestorage.app",
  messagingSenderId: "20072193337",
  appId: "1:20072193337:web:57a427559ff7b6dea05ce8",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* LOADER */
function showLoader(){
  document.getElementById("loader").style.display="flex";
  document.getElementById("check").style.display="none";
}

function hideLoader(){
  document.getElementById("loader").style.display="none";
}

/* SIGNUP */
function signup(){

  let name = document.getElementById("signupName").value;
  let email = document.getElementById("signupEmail").value;
  let password = document.getElementById("signupPassword").value;

  showLoader();

  auth.createUserWithEmailAndPassword(email, password)
  .then(async (userCredential)=>{

    let user = userCredential.user;

    await db.collection("users").doc(user.uid).set({
      name,
      email
    });

    // مدة عشوائية 3 - 6 ثواني
    let time = Math.floor(Math.random() * 3000) + 3000;

    setTimeout(()=>{

      document.getElementById("check").style.display="block";

      setTimeout(()=>{

        hideLoader();

        // تنظيف الحقول
        document.getElementById("signupName").value="";
        document.getElementById("signupEmail").value="";
        document.getElementById("signupPassword").value="";

        showLogin();

      }, 1000);

    }, time);

  })
  .catch(err=>{
    hideLoader();
    alert(err.message);
  });

}

/* LOGIN */
async function login(){

  let input = document.getElementById("loginEmail").value;
  let password = document.getElementById("loginPassword").value;

  let email = input;

  if(!input.includes("@")){
    let snapshot = await db.collection("users")
      .where("phone", "==", input)
      .get();

    if(snapshot.empty){
      alert("رقم الهاتف غير مسجل");
      return;
    }

    snapshot.forEach(doc=>{
      email = doc.data().email;
    });
  }

  auth.signInWithEmailAndPassword(email, password)
  .then(()=>{
    window.location.href = "kimo2.html";
  })
  .catch(err=>{
    alert(err.message);
  });

}

/* tabs */
function showLogin(){
  loginForm.classList.add("active");
  signupForm.classList.remove("active");
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
}

function showSignup(){
  signupForm.classList.add("active");
  loginForm.classList.remove("active");
  signupTab.classList.add("active");
  loginTab.classList.remove("active");
}

</script>

</body>
</html>
