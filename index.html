<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --primary:#2563eb;
  --card:#ffffff;
  --text:#1e293b;
  --sub:#64748b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#e0e7ff,#f5f7fb);
}

.app{
  width:360px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
  padding:20px;
  position:relative;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:var(--text);
}

.tabs{
  display:flex;
  background:#eef2ff;
  border-radius:14px;
  padding:4px;
  margin:15px 0;
}

.tabs div{
  flex:1;
  text-align:center;
  padding:10px;
  cursor:pointer;
  color:var(--sub);
  transition:0.3s;
}

.tabs .active{
  background:white;
  color:var(--primary);
  border-radius:10px;
}

.form{display:none;}
.form.active{
  display:block;
  animation:pop 0.4s ease;
}

@keyframes pop{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.input input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #e2e8f0;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  cursor:pointer;
}

.google-btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  background:white;
  border:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  transition:0.3s;
  font-weight:500;
}

.google-btn:hover{
  transform:scale(1.03);
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* ===== LOADER ===== */
.loader{
  display:none;
  text-align:center;
  margin-top:10px;
  color:var(--primary);
}

/* ===== TOAST ===== */
.toast{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111827;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:14px;
  display:none;
  z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* ===== SHAKE ===== */
.shake{
  animation:shake 0.4s;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

/* ===== SPINNER ===== */
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.35);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
">

  <div id="spinner" style="
  width:60px;
  height:60px;
  border:6px solid #ddd;
  border-top:6px solid #2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
  "></div>

  <div id="check" style="
  display:none;
  font-size:60px;
  color:#22c55e;
  ">✔</div>

</div>

<div class="app" id="app">

<div class="toast" id="toast"></div>

<div class="top">
  <div class="logo">حجوزاتي</div>
</div>

<div class="tabs">
  <div id="loginTab" class="active" onclick="showLogin()">دخول</div>
  <div id="signupTab" onclick="showSignup()">إنشاء حساب</div>
</div>

<!-- LOGIN -->
<div id="loginForm" class="form active">

  <div class="input">
    <input id="loginEmail" placeholder="الإيميل أو رقم الهاتف">
  </div>

  <div class="input">
    <input id="loginPassword" type="password" placeholder="كلمة المرور">
  </div>

  <button class="btn" onclick="login()">دخول</button>

  <button class="google-btn" onclick="googleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    تسجيل الدخول باستخدام Google
  </button>

</div>

<!-- SIGNUP -->
<div id="signupForm" class="form">

  <div class="input"><input id="signupName" placeholder="الاسم"></div>
  <div class="input"><input id="signupEmail" placeholder="الإيميل"></div>
  <div class="input"><input id="signupPassword" type="password" placeholder="كلمة المرور"></div>

  <button class="btn" onclick="signup()">إنشاء حساب</button>

  <div class="loader" id="loader">⏳ جاري إنشاء الحساب...</div>

  <button class="google-btn" onclick="googleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    التسجيل باستخدام Google
  </button>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAv6mskNbOqDqOFDyX3GFRr6JtC2_mBU14",
  authDomain: "my-reservatinos.firebaseapp.com",
  projectId: "my-reservatinos",
  storageBucket: "my-reservatinos.firebasestorage.app",
  messagingSenderId: "20072193337",
  appId: "1:20072193337:web:57a427559ff7b6dea05ce8",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ===== LOADING ===== */
const loadingOverlay = document.getElementById("loadingOverlay");
const spinner = document.getElementById("spinner");
const check = document.getElementById("check");

function showLoading(){
  loadingOverlay.style.display="flex";
  spinner.style.display="block";
  check.style.display="none";
}

function successLoading(){
  spinner.style.display="none";
  check.style.display="block";

  setTimeout(()=>{
    loadingOverlay.style.display="none";
  },1000);
}

function hideLoading(){
  loadingOverlay.style.display="none";
}

/* ===== SIGNUP (FIXED AS REQUESTED) ===== */
function signup(){

  let name = signupName.value;
  let email = signupEmail.value;
  let password = signupPassword.value;

  if(!name || !email || !password){
    return;
  }

  showLoading();

  // ⬅️ التحميل هنا مستقل 4 ثواني بدون علاقة بالنتيجة
  setTimeout(()=>{
    successLoading();
    showToast("تم إنشاء الحساب بنجاح");
    showLogin();
  },4000);

  // Firebase شغال في الخلفية
  auth.createUserWithEmailAndPassword(email,password)
  .then(async (userCredential)=>{
    let user = userCredential.user;
    await db.collection("users").doc(user.uid).set({name,email});
  })
  .catch(()=>{});
}

/* ===== LOGIN ===== */
function login(){

  let email = loginEmail.value;
  let password = loginPassword.value;

  showLoading();

  auth.signInWithEmailAndPassword(email,password)
  .then(()=>{
    hideLoading();
    window.location.href="kimo2.html";
  })
  .catch(()=>{
    hideLoading();
  });

}

/* ===== GOOGLE ===== */
function googleLogin(){

  const provider = new firebase.auth.GoogleAuthProvider();

  showLoading();

  auth.signInWithPopup(provider)
  .then(()=>{
    hideLoading();
    window.location.href="kimo2.html";
  })
  .catch(()=>{
    hideLoading();
  });

}

/* ===== TOAST ===== */
function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}

/* ===== TABS ===== */
function showLogin(){
  loginForm.classList.add("active");
  signupForm.classList.remove("active");
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
}

function showSignup(){
  signupForm.classList.add("active");
  loginForm.classList.remove("active");
  signupTab.classList.add("active");
  loginTab.classList.remove("active");
}

</script>

</body>
</html>
